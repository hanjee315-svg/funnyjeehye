<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>클릭 게임</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    overflow: hidden;
  }

  h1 {
    margin-top: 30px;
  }

  #info {
    font-size: 22px;
    margin: 20px;
  }

  #target {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #00ccff;
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: none;
  }

  #startBtn {
    padding: 15px 30px;
    font-size: 22px;
    border: none;
    border-radius: 12px;
    background: #00ff88;
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>지혜의 클릭 게임 🎯</h1>

<div id="info">
  제한시간 15초 안에 최대한 많이 클릭하세요!
</div>

<button id="startBtn" onclick="startGame()">게임 시작</button>
<button id="target" onclick="hitTarget()">클릭!</button>

<script>
let score = 0;
let timeLeft = 15;
let timer;

const info = document.getElementById("info");
const target = document.getElementById("target");
const startBtn = document.getElementById("startBtn");

function startGame() {
  score = 0;
  timeLeft = 15;

  startBtn.style.display = "none";
  target.style.display = "block";

  info.innerHTML = `점수: ${score} | 남은 시간: ${timeLeft}초`;

  moveTarget();

  timer = setInterval(() => {
    timeLeft--;
    info.innerHTML = `점수: ${score} | 남은 시간: ${timeLeft}초`;

    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function hitTarget() {
  score++;
  info.innerHTML = `점수: ${score} | 남은 시간: ${timeLeft}초`;
  moveTarget();
}

function moveTarget() {
  const maxX = window.innerWidth - 100;
  const maxY = window.innerHeight - 100;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  target.style.left = x + "px";
  target.style.top = y + "px";
}

function endGame() {
  clearInterval(timer);
  target.style.display = "none";
  startBtn.style.display = "inline-block";
  startBtn.innerText = "다시 시작";

  info.innerHTML = `게임 종료! 최종 점수: ${score}점 🎉`;
}
</script>

</body>
</html>
